<section class="page-head">
  <h1>Dashboard</h1>
  <p>Hoş geldin, <strong>{{ user?.fullName }}</strong> 👋</p>
</section>

@if (user) {
  <div class="cards">
    <div class="card">
      <span class="material-icons">badge</span>
      <div>
        <div class="card-label">Ad Soyad</div>
        <div class="card-value">{{ user.fullName }}</div>
      </div>
    </div>

    <div class="card">
      <span class="material-icons">person</span>
      <div>
        <div class="card-label">Kullanıcı Adı</div>
        <div class="card-value">{{ user.username }}</div>
      </div>
    </div>

    <div class="card">
      <span class="material-icons">verified_user</span>
      <div>
        <div class="card-label">Rol</div>
        <div class="card-value"><span class="role-badge">{{ user.role }}</span></div>
      </div>
    </div>
  </div>
} @else {
  <p>Kullanıcı bilgisi bulunamadı.</p>
}
